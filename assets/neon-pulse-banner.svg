<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 300"
     width="1200"
     height="300"
     role="img"
     aria-label="Jai Saraswat — Computer Science and Data Science">
  <defs>
    <linearGradient id="np-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>

    <linearGradient id="np-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00d9"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d9ff"/>
      <animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="np-spectrum2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff00d9"/>
      <animate attributeName="x1" values="1;2;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;-1;0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="np-glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0
                0 0.2 0 0 0.6
                0 0 1 0 1
                0 0 0 1 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="np-soft" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <linearGradient id="np-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00d9ff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#7c5cff" stop-opacity="1"/>
      <stop offset=".75" stop-color="#ff00d9" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff00d9" stop-opacity="0"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#np-bg)"/>

  <!-- Ambient neon atmosphere -->
  <path d="M-50 245 C180 155 300 310 520 220 C760 120 890 285 1250 170"
        fill="none" stroke="url(#np-spectrum)" stroke-width="34" opacity=".12" filter="url(#np-soft)">
    <animate attributeName="d"
      dur="14s" repeatCount="indefinite"
      values="
      M-50 245 C180 155 300 310 520 220 C760 120 890 285 1250 170;
      M-50 215 C180 300 330 145 540 240 C750 335 980 130 1250 215;
      M-50 245 C180 155 300 310 520 220 C760 120 890 285 1250 170"/>
  </path>

  <!-- Far wave -->
  <path d="M-40 205 C150 145 300 245 500 190 C720 130 930 255 1240 180"
        fill="none" stroke="url(#np-spectrum2)" stroke-width="2" opacity=".28">
    <animate attributeName="d"
      dur="14s" repeatCount="indefinite"
      values="
      M-40 205 C150 145 300 245 500 190 C720 130 930 255 1240 180;
      M-40 185 C160 250 320 135 510 215 C730 295 970 135 1240 210;
      M-40 205 C150 145 300 245 500 190 C720 130 930 255 1240 180"/>
  </path>

  <!-- Middle wave -->
  <path d="M-40 225 C150 175 305 270 505 205 C735 130 935 280 1240 195"
        fill="none" stroke="url(#np-spectrum)" stroke-width="3" opacity=".62">
    <animate attributeName="d"
      dur="9s" repeatCount="indefinite"
      values="
      M-40 225 C150 175 305 270 505 205 C735 130 935 280 1240 195;
      M-40 190 C160 270 325 145 525 225 C750 305 960 145 1240 225;
      M-40 225 C150 175 305 270 505 205 C735 130 935 280 1240 195"/>
  </path>

  <!-- Front glowing wave -->
  <path d="M-40 240 C150 185 300 295 515 220 C740 140 930 300 1240 210"
        fill="none" stroke="url(#np-spectrum)" stroke-width="5" filter="url(#np-glow)">
    <animate attributeName="d"
      dur="6s" repeatCount="indefinite"
      values="
      M-40 240 C150 185 300 295 515 220 C740 140 930 300 1240 210;
      M-40 205 C165 285 320 150 535 240 C755 325 970 155 1240 235;
      M-40 240 C150 185 300 295 515 220 C740 140 930 300 1240 210"/>
  </path>

  <!-- Chromatic headline ghost -->
  <text x="600" y="92"
        text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif"
        font-size="58"
        font-weight="800"
        letter-spacing="1.5"
        fill="url(#np-spectrum)"
        opacity=".8"
        filter="url(#np-soft)">JAI SARASWAT</text>

  <text x="600" y="92"
        text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif"
        font-size="58"
        font-weight="800"
        letter-spacing="1.5"
        fill="#f8fafc">JAI SARASWAT</text>

  <text x="600" y="132"
        text-anchor="middle"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="16"
        font-weight="700"
        letter-spacing="4"
        fill="#cbd5e1">COMPUTER SCIENCE · DATA SCIENCE</text>

  <!-- Tag chips -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="12" text-anchor="middle">
    <g transform="translate(600 170)">
      <rect x="-295" y="-16" width="132" height="30" rx="15" fill="#111827" stroke="#00d9ff" stroke-opacity=".7"/>
      <text x="-229" y="4" fill="#00d9ff">PYTHON</text>

      <rect x="-151" y="-16" width="116" height="30" rx="15" fill="#111827" stroke="#7c5cff" stroke-opacity=".8"/>
      <text x="-93" y="4" fill="#a78bfa">AI / ML</text>

      <rect x="-23" y="-16" width="126" height="30" rx="15" fill="#111827" stroke="#ff00d9" stroke-opacity=".8"/>
      <text x="40" y="4" fill="#ff5ee9">COMPUTER VISION</text>

      <rect x="115" y="-16" width="120" height="30" rx="15" fill="#111827" stroke="#00d9ff" stroke-opacity=".7"/>
      <text x="175" y="4" fill="#67e8f9">DATA SCIENCE</text>

      <rect x="247" y="-16" width="92" height="30" rx="15" fill="#111827" stroke="#7c5cff" stroke-opacity=".8"/>
      <text x="293" y="4" fill="#c4b5fd">C++</text>
    </g>
  </g>

  <text x="600" y="218"
        text-anchor="middle"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="12"
        letter-spacing="2.5"
        fill="#94a3b8">BUILDING · LEARNING · EXPERIMENTING · IMPROVING</text>

  <circle cx="600" cy="248" r="3" fill="#39d353">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="614" y="252"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="10"
        fill="#64748b">ONLINE · OPEN TO BUILDING</text>

  <text x="36" y="276"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="9"
        letter-spacing="2"
        fill="#475569">AI · ML · CV · SOFTWARE</text>
  <text x="1164" y="276"
        text-anchor="end"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="9"
        letter-spacing="2"
        fill="#39d353">JAI@GITHUB</text>
</svg>
